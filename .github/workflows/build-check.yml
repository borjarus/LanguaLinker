name: Build check

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  android-build:
    name: Android build and shared tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android app
        run: ./gradlew :androidApp:assembleDebug

      # Runs the FSRS suite, the repository integration tests, the migration test and the
      # bundled-content linter. The linter is what fails the build on a deck that references a
      # word card nobody authored.
      - name: Run shared tests
        run: ./gradlew :shared:jvmTest :shared:testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/

  ios-build:
    name: iOS build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
